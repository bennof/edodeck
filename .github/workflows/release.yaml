name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag must match package.json version
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Manual run from a tag publishes a release, exactly like a tag push.
      # Manual run from a branch is a dry run: build, keep the zip as a
      # workflow artifact, publish nothing.
      - name: Package
        id: pkg
        run: |
          name="edodeck-$(node -p "require('./package.json').version")"
          zip -r "$name.zip" dist/ LICENSE
          echo "zip=$name.zip" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: ${{ steps.pkg.outputs.zip }}
          generate_release_notes: true

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: edodeck
          path: ${{ steps.pkg.outputs.zip }}
